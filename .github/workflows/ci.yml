name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # `npm test` runs on EVERY Node the package advertises. The runner strips
  # types where Node can (22.6+) and compiles first where it cannot (18, 20),
  # so the matrix is the engines floor, not the contributor's Node. Node 20 is
  # here specifically: it used to answer `node: bad option`.
  typescript:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Prove the compile fallback on a Node that would otherwise take the fast
      # path, so the older-Node route cannot rot between releases.
      - run: npm test
        env:
          CONIFER_TEST_COMPILE: "1"

  # Guards the `engines` floor: the BUILT package must import and run on the
  # oldest Node we advertise. Catches an accidental ES2023+ emit.
  consumer:
    name: Built package on Node 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: import the built entry point
        run: node -e "import('./dist/src/index.js').then(m => { if (typeof m.Conifer !== 'function') { throw new Error('Conifer missing from the built package'); } console.log('built package imports on', process.version); })"

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The package declares no runtime dependencies, so the suite needs only
      # a test runner, declared test-only in requirements-dev.txt (and the
      # `dev` extra). Keep it that way: see CONTRIBUTING.md.
      - run: python -m pip install -r requirements-dev.txt
        working-directory: python
      - run: python -m pytest tests -q
        working-directory: python
      # The suite is stdlib unittest, so it must also pass with NOTHING
      # installed — that is what keeps pytest a convenience, not a dependency.
      - run: python -m unittest discover -s tests -t tests -q
        working-directory: python
