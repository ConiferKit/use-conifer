[project]
name = "conifer-sdk"
version = "0.1.2"
description = "The Conifer gateway SDK: one client, exact per-turn cost receipts, and honest migration shims from OpenRouter, Vercel AI Gateway, and Helicone."
requires-python = ">=3.10"
# No dependencies, on purpose: the SDK works in a lambda, a Slack bot, or a
# locked-down build image without a package tree to audit.
dependencies = []
license = "Apache-2.0"
# A SYMLINK to the repo README one directory up (see python/README.md).
#
# Symlinked rather than copied because two copies of a 400-line document drift,
# and the stale one is always the one a user reads on PyPI. Symlinked rather
# than referenced as `../README.md` because setuptools refuses to read anything
# outside the package root — it fails the build loudly, which is how this was
# confirmed.
#
# This was silently BROKEN before: the file did not exist here at all, and
# setuptools resolved it to nothing WITHOUT a warning, so the wheel's METADATA
# carried `Description-Content-Type: text/markdown` and an EMPTY body — a blank
# PyPI project page for the launch. Caught by inspecting the built artifact
# rather than trusting the build's exit code. `sdist_contains_readme` in the
# packaging test now pins it.
readme = "README.md"
authors = [{ name = "Conifer" }]
keywords = ["conifer", "llm", "openai", "anthropic", "gateway", "ai", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

# TEST-ONLY, never installed for a user of the SDK: `pip install -e ".[dev]"`
# (or `pip install -r requirements-dev.txt`) is the documented way to get a
# runner. `dependencies` above stays empty on purpose — see CONTRIBUTING.md.
# The suite itself is stdlib `unittest` and runs with no extras at all via
# `python -m unittest discover -s tests -t .`.
[project.optional-dependencies]
dev = ["pytest>=7.0"]
# `pip install "conifer-sdk[tls]"` — a CA bundle, for a Python that has none.
#
# WHY THIS IS AN EXTRA AND NOT A DEPENDENCY. A python.org macOS install whose
# "Install Certificates.command" was never run has an EMPTY trust store, and so
# does a venv built on it: it cannot verify ANY https host, and the SDK's first
# call fails with CERTIFICATE_VERIFY_FAILED. That was reproduced in a
# fresh-venv install test, which is exactly how a new user meets it.
#
# The SDK already detects the empty store and uses certifi's bundle when it is
# importable, so this extra is the one-command fix. It stays OPT-IN because
# `dependencies` being empty is a real feature — the SDK drops into a lambda or
# a locked-down build image with no package tree to audit — and because most
# environments (Linux, Homebrew, Docker, conda) have a working store already,
# where certifi would be dead weight.
tls = ["certifi"]

[project.urls]
Homepage = "https://conifer.build"
Documentation = "https://conifer.build/docs/sdk/conifer/"
Source = "https://github.com/ConiferKit/use-conifer"
Issues = "https://github.com/ConiferKit/use-conifer/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["conifer_sdk"]

# PEP 561. WITHOUT this marker every type hint in the package is INVISIBLE:
# mypy and pyright must treat an installed package as untyped unless it ships
# py.typed, so `conifer_sdk` resolved to Any and users got an
# "missing library stubs or py.typed marker" error just for importing. The
# hints were all there and none of them reached anyone. Verified with mypy
# against the published wheel before and after.
[tool.setuptools.package-data]
conifer_sdk = ["py.typed"]
